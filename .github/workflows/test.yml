# CI will be red until Task 6 lands bin/xfleet (smoke.bats is an intentional TDD red).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: pip install jsonschema

      - name: Install BATS
        run: sudo apt-get update -y && sudo apt-get install -y bats

      - name: Check state-schema drift
        run: bash tools/xfleet/check-state-schema-drift.sh

      - name: Run tests
        run: bash tests/run-all.sh
